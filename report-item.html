```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Item - Campus Lost & Found</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Campus Lost & Found</h1>
    <p>Report your lost item</p>

    <nav>
        <a href="index.html">Home</a>
        <a href="lost-items.html">Lost Items</a>
        <a href="report-item.html">Report Item</a>
    </nav>
</header>

<main>
    <div class="form-container">

        <h2>Report a Lost Item</h2>

        <form>

            <label>Item Name</label>
            <input type="text" placeholder="Enter item name">

            <label>Where did you lose it?</label>
            <input type="text" placeholder="Example: Library">

            <label>Date</label>
            <input type="date">

            <label>Description</label>
            <textarea rows="5" placeholder="Describe the item..."></textarea>

            <label>Your Name</label>
            <input type="text" placeholder="Enter your name">

            <label>Contact Number</label>
            <input type="tel" placeholder="Enter contact number">

            <button type="submit">Submit Report</button>

        </form>

    </div>
</main>

<footer>
    <p>© 2026 Campus Lost & Found | Student Project</p>
</footer>

</body>
</html>
